services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports:
      - "127.0.0.1:${SQL_HOST_PORT:-1433}:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - ./database/create-databases.sql:/tmp/create-databases.sql:ro
    entrypoint: ["/bin/bash", "-c", "/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -i /tmp/create-databases.sql"]
    restart: "no"
  ms-account:
    build: ./MSAccount_de181019
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: sqlserver
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
  ms-brand:
    build: ./MSBrand_de181019
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: sqlserver
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY}
  ms-watch:
    build: ./MSWatch_de181019
    depends_on:
      ms-brand:
        condition: service_started
      db-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: sqlserver
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY}
      BRAND_SERVICE_URL: http://ms-brand:8082
      SAGA_FAULT_INJECTION: ${SAGA_FAULT_INJECTION:-false}
  api-gateway:
    build: ./APIGateway_de181019
    depends_on:
      - ms-account
      - ms-brand
      - ms-watch
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-8080}:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      ACCOUNT_SERVICE_URL: http://ms-account:8081
      BRAND_SERVICE_URL: http://ms-brand:8082
      WATCH_SERVICE_URL: http://ms-watch:8083
volumes:
  sql-data:
