server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:            # route của Gateway server WebFlux: spring.cloud.gateway.server.webflux.routes
          routes:
            - id: account-service
              uri: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: accountCB
                    fallbackUri: forward:/fallback/account

            - id: brand-service
              uri: ${BRAND_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/brands/**        # KHÔNG route /internal/** -> API nội bộ của Saga không lộ ra ngoài
              filters:
                - name: CircuitBreaker
                  args:
                    name: brandCB
                    fallbackUri: forward:/fallback/brand

            - id: watch-service
              uri: ${WATCH_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/watches/**,/api/sagas/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: watchCB
                    fallbackUri: forward:/fallback/watch

jwt:
  secret: ${JWT_SECRET}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
    instances:
      accountCB:
        base-config: default
      brandCB:
        base-config: default
      watchCB:
        base-config: default
  timelimiter:
    configs:
      default:
        # Saga có thể mất vài giây (compensation retry 3 lần x 1s).
        # Nếu để mặc định 1s, Gateway sẽ trả fallback 503 trong khi Saga ở MSWatch vẫn đang chạy.
        timeout-duration: 60s
    instances:              # khai báo rõ cho từng CB để chắc chắn áp dụng 60s
      accountCB:
        base-config: default
      brandCB:
        base-config: default
      watchCB:
        base-config: default

logging:
  level:
    org.springframework.cloud.gateway: INFO
